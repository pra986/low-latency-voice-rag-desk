[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-voice-rag-desk"
version = "0.1.0"
description = "Low-latency ElevenLabs and Twilio voice RAG support desk with offline Supabase pgvector ingestion, hybrid SKU lookup, and human escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
voice-rag-desk = "voice_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
